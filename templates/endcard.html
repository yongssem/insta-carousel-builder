<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1350px;background:#0B0B0E;
    font-family:'Pretendard Variable',sans-serif;color:#fff;
    overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  /* 원본 비율 유지 + 캔버스 안에 완전히 들어가게 (잘림 없음) */
  .promo{
    max-width:1080px;max-height:1350px;
    width:auto;height:auto;
    object-fit:contain;display:block;
  }
  /* 레터박스 영역이 생겼을 때 경계가 뜨지 않도록 은은한 글로우 */
  .glow{
    position:absolute;width:1200px;height:1200px;border-radius:50%;
    background:radial-gradient(circle,rgba(207,92,63,0.10) 0%,rgba(207,92,63,0) 62%);
    top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;z-index:0;
  }
  .promo{position:relative;z-index:1}
  /* 이미지가 없을 때 안내 (Puppeteer 캡처 전에 눈으로 확인 가능) */
  .missing{
    display:none;text-align:center;padding:0 100px;z-index:1;
  }
  .missing h1{font-size:52px;font-weight:800;margin-bottom:28px;letter-spacing:-0.02em}
  .missing p{font-size:24px;line-height:1.6;color:rgba(255,255,255,0.5)}
  .missing code{
    font-family:'SF Mono','Consolas',monospace;font-size:22px;
    color:#E98A63;background:rgba(207,92,63,0.12);
    padding:4px 12px;border-radius:8px;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <img class="promo" src="../assets/book-promo-endcard.png" alt=""
       onerror="this.style.display='none';document.querySelector('.missing').style.display='block'">

  <div class="missing">
    <h1>엔드카드 이미지가 없습니다</h1>
    <p>홍보 이미지를 <code>assets/book-promo-endcard.png</code> 로 저장한 뒤<br>다시 실행하세요.</p>
  </div>
</body>
</html>
